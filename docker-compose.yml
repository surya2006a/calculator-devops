name: calculator-devops

services:
  calculator:
    image: ${DOCKER_IMAGE:-your-dockerhub-username/calculator-api}:${IMAGE_TAG:-latest}
    build: .
    environment:
      - SERVER_PORT=8080
      - JAVA_TOOL_OPTIONS=-Xmx256m
    expose:
      - "8080"
    networks:
      - calc-net
    restart: unless-stopped
    deploy:
      replicas: 2
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8083:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      calculator:
        condition: service_healthy
    networks:
      - calc-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  calc-net:
    driver: bridge
